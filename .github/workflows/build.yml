name: Watch beta native archives

on:
  push:
    branches: [watch-combined]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watch-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p test_watch_ci.py -v
      - run: bash -n .github/build-watch.sh

  native-build:
    needs: config-tests
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    outputs:
      artifact: ${{ steps.native.outputs.artifact }}
      host_archive: ${{ steps.native.outputs.host_archive }}
      sidestore_archive: ${{ steps.native.outputs.sidestore_archive }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Compile pinned native sources (unsigned, not combined)
        id: native
        run: bash .github/build-watch.sh
      - name: Upload native archives and source provenance for later packaging
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-watch-beta-${{ github.sha }}-${{ github.run_attempt }}
          path: native-output/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-watch-beta-logs-${{ github.sha }}-${{ github.run_attempt }}
          path: native-logs/*
          if-no-files-found: warn
          retention-days: 7
